[project]
name = "spork"
version = "0.1.0"
description = "Tiered, JMAP-native email triage daemon + CLI for a single Fastmail account."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "secretspec>=0.18,<1",
    "keyring>=25,<26",
    "typer>=0.27,<1",
]

[project.optional-dependencies]
jmap = ["jmapc>=0.3,<0.4"]
llm = ["litellm>=1.75,<2"]
receipts = ["pypdf>=6.15.0,<7", "reportlab>=4.0,<5", "Pillow>=10.0,<12"]

# Two executables, one shared package (spork.core) — see docs/DESIGN.md §6.
# spork.cli.main:app is the Typer app object itself (callable, reads
# sys.argv) — no separate wrapper needed. sporkd needs one (`run`)
# since main() takes typer.Option-annotated args unusable if called
# directly; see spork.daemon.main's module docstring.
[project.scripts]
sporkd = "spork.daemon.main:run"
spork = "spork.cli.main:app"

[dependency-groups]
dev = [
    "jmapc>=0.3,<0.4",
    "litellm>=1.75,<2",
    "pypdf>=6.15.0,<7",
    "reportlab>=4.0,<5",
    "Pillow>=10.0,<12",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0,<6",
    "pytest-benchmark>=4.0,<5",
    "behave>=1.2.6,<2",
    "hypothesis>=6.100,<7",
    "mutmut>=3.0,<4",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pdoc>=14.5,<15",
    "mitmproxy>=11,<12",
    "bandit>=1.9.4",
    "vulture>=2.16",
    "deptry>=0.25.1",
    "pip-audit>=2.10.1",
    "crosshair-tool>=0.0.110",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spork"]

[tool.pytest.ini_options]
# Acceptance/unit tests only — no live network, no live JMAP/LLM calls.
# See docs/DESIGN.md §16 for the layered test strategy. `benchmarks/`
# is deliberately excluded: pytest-benchmark's repeated-call timing is
# a different kind of test than correctness, and shouldn't run (or
# slow down) every push — run it explicitly with
# `uv run pytest benchmarks/` (docs/DESIGN.md §9.4).
testpaths = ["tests"]
# importlib mode (rather than pytest's default sys.path-prepend mode)
# so tests/<pkg>/test_<module>.py can mirror src/spork/<pkg>/<module>.py
# 1:1 (per scripts/related_tests.py) without every test directory
# needing an __init__.py, and without same-named test files in
# different directories (e.g. tests/cli/test_main.py and
# tests/daemon/test_main.py) colliding at collection time.
addopts = "--strict-markers --import-mode=importlib"
# xfail tests document not-yet-implemented, already-specified behavior
# (docs/TEST_COVERAGE.md). Strict mode turns an unexpected XPASS into a
# failure, forcing the xfail marker to be removed deliberately when a
# feature actually lands, rather than a stale marker silently hiding
# that it's done.
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
# static_analysis/vulture_whitelist.py is deliberately not real Python —
# vulture only parses its AST for bare name references (its own
# --make-whitelist format), so every line is an "undefined name"/
# "useless expression" to ruff. Excluded rather than fought with noqa
# comments on every line.
extend-exclude = ["static_analysis/vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["spork"]
mypy_path = "src"

# secretspec ships no py.typed marker / stubs (it's a pyo3 native
# extension wrapper) — this is the one place we trust its runtime
# behavior without static checking, not a general opt-out.
[[tool.mypy.overrides]]
module = "secretspec"
ignore_missing_imports = true

# Mutation testing (docs/DESIGN.md §16.2, mutation/README.md): scoped to
# the decision-critical modules that are also already at 100% line
# coverage — the two preconditions that make a surviving mutant worth a
# human's time. Deliberately not every module at 100% coverage (e.g.
# schema/config loaders are structural, not decision logic). Run with
# `uv run mutmut run`, never as part of `uv run pytest` or either CI
# gate — see mutation/README.md for why.
[tool.mutmut]
# source_paths is the whole package (not just the in-scope files) —
# mutmut copies whatever it names into mutants/ verbatim, and the
# in-scope files still need the rest of spork.core importable alongside
# them (spork.core.models, etc.). only_mutate is what actually narrows
# which lines get mutated to the eight decision-critical files.
source_paths = ["src/spork"]
only_mutate = [
    "src/spork/core/rules/engine.py",
    "src/spork/core/actions/executor.py",
    "src/spork/core/dispatch/combine.py",
    "src/spork/core/pipeline/default.py",
    "src/spork/core/llm/confidence.py",
    "src/spork/core/classify/keyword.py",
    "src/spork/core/receipts/extract.py",
    "src/spork/core/pipeline/tier2/escalate.py",
]
pytest_add_cli_args_test_selection = [
    "tests/core/rules",
    "tests/core/actions",
    "tests/core/dispatch",
    "tests/core/pipeline",
    # Not the whole tests/core/llm directory: test_recording.py's
    # test_live_acceptance_corpus_directory_is_gitignored() walks up to
    # the repo root via Path(__file__).parents[3] to read .gitignore —
    # real under a normal pytest run, but mutmut's mutants/ working
    # copy has no .gitignore at that depth, so the whole run fails
    # before any mutant is even tried. Named explicitly to stay
    # decoupled from that landmine.
    "tests/core/llm/test_confidence.py",
    "tests/core/llm/test_confidence_edge_cases.py",
    "tests/core/llm/test_confidence_fuzz.py",
    "tests/core/classify",
    "tests/core/receipts",
]

# Security static analysis (static_analysis/README.md documents the full
# baseline). Skips four rule categories confirmed as known-safe patterns
# by hand, not blindly accepted — B108 (a hardcoded /tmp path with a
# real, unaddressed symlink-race risk) and B101 (assert-as-invariant,
# stripped under python -O) are deliberately left unskipped so they stay
# visible in every run.
[tool.bandit]
skips = [
    "B404", # subprocess import — every call site uses list args, never shell=True
    "B603", # subprocess call without shell=True — the safe pattern, not the risky one
    "B406", # xml.sax.saxutils.escape — output-escaping for a PDF, not parsing untrusted XML
    "B110", # try/except/pass in receipts/pdf.py — already reasoned in a ruff noqa comment
]

[tool.deptry]
known_first_party = ["spork"]
# jmapc/litellm are real, used dependencies — imported via
# importlib.import_module("...") string literals (spork.core.providers.jmap.client,
# spork.core.llm.clients.litellm, spork.core.receipts.pdf) specifically so
# an unconfigured backend's dependency is never imported at module load
# time (CLAUDE.md "Architecture"). deptry's static import scan can't see
# a dynamic import by construction — that's the same property the
# dynamic-loader architecture is *for*, not a real unused-dependency gap.
[tool.deptry.per_rule_ignores]
DEP002 = ["jmapc", "litellm"]
# behave is a real dev dependency, imported by docs/acceptance/steps/*.py
# (Gherkin step definitions) — deptry scans docs/ as production code
# since it has no separate "test code" concept for that directory.
DEP004 = ["behave"]

[tool.uv]
override-dependencies = ["h11>=0.16"]
