[project]
name = "spork"
version = "0.1.0"
description = "Tiered, JMAP-native email triage daemon + CLI for a single Fastmail account."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
]

# Two executables, one shared package (spork.core) — see docs/DESIGN.md §6.
[project.scripts]
sporkd = "spork.daemon.main:main"
spork = "spork.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pdoc>=14.5,<15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spork"]

[tool.pytest.ini_options]
# Acceptance/unit tests only — no live network, no live JMAP/LLM calls.
# See docs/DESIGN.md §16 for the layered test strategy.
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["spork"]
mypy_path = "src"
